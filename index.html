<!doctype html>
<html lang="es">
  <head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <meta name="theme-color" content="#062a21">
    <meta name="description" content="Presentación final de Parity · Proyecto Integrador I · UNSAM">
    <title>Parity · Presentación final</title>
    <link rel="stylesheet" href="style.css">
    <script src="script.js" defer></script>
  </head>
  <body>
    <header class="topbar">
      <a class="wordmark" href="#slide-1" aria-label="Ir a la portada"><img src="logo-parity.png?v=2" alt="Parity"></a>
      <div class="topbar-actions">
        <button class="icon-button" id="open-index" type="button" aria-haspopup="dialog" aria-controls="slide-index" aria-label="Abrir índice" title="Índice (I)">
          <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M4 6h16M4 12h16M4 18h16"/></svg>
        </button>
        <a class="icon-button" href="parity-presentacion.pdf" download aria-label="Descargar PDF" title="Descargar PDF original">
          <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M12 3v12m-5-5 5 5 5-5M4 20h16"/></svg>
        </a>
        <button class="icon-button" id="fullscreen" type="button" aria-label="Ver en pantalla completa" title="Pantalla completa (F)">
          <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M8 3H3v5m13-5h5v5M3 16v5h5m13-5v5h-5"/></svg>
        </button>
      </div>
    </header>

    <main class="presentation" id="presentation" aria-label="Presentación de Parity">
      <button class="side-nav side-nav--previous" id="previous" type="button" aria-label="Diapositiva anterior" title="Anterior (←)">
        <svg viewBox="0 0 24 24" aria-hidden="true"><path d="m15 18-6-6 6-6"/></svg>
      </button>
      <figure class="slide-frame" id="slide-frame">
        <img class="slide-image" id="slide-image" src="slides/slide-01.png" alt="Diapositiva 1 de 16: portada de Parity" draggable="false">
        <video class="slide-video" id="slide-video" controls playsinline preload="metadata" aria-label="Video de demostración de Parity">
          <source src="demo-parity.mp4" type="video/mp4">
          Tu navegador no puede reproducir este video.
        </video>
        <div class="demo-card-label-cover" aria-hidden="true"></div>
        <p class="demo-footer-cover">Video de demostración</p>
        <button class="video-fullscreen" id="video-fullscreen" type="button">Ver video en pantalla completa</button>
        <figcaption class="sr-only" id="slide-caption" aria-live="polite">Diapositiva 1 de 16: Portada</figcaption>
        <p class="image-error" id="image-error" role="alert" hidden>No se pudo cargar esta diapositiva. Comprobá que la carpeta <code>slides</code> esté junto a <code>index.html</code>.</p>
        <p class="image-error" id="video-error" role="alert" hidden>No se pudo cargar o reproducir el video. Comprobá que <code>demo-parity.mp4</code> esté junto a <code>index.html</code> y que tu navegador admita su formato.</p>
      </figure>
      <button class="side-nav side-nav--next" id="next" type="button" aria-label="Diapositiva siguiente" title="Siguiente (→)">
        <svg viewBox="0 0 24 24" aria-hidden="true"><path d="m9 18 6-6-6-6"/></svg>
      </button>
    </main>

    <footer class="bottombar">
      <div class="slide-count" aria-label="Número de diapositiva">
        <span id="current-slide">01</span><span class="count-divider">/</span><span id="total-slides">16</span>
      </div>
      <div class="progress-track" role="progressbar" aria-label="Progreso de la presentación" aria-valuemin="1" aria-valuemax="16" aria-valuenow="1" id="progress">
        <span id="progress-bar"></span>
      </div>
      <div class="footer-hint"><span>Usá las flechas para navegar</span><kbd>←</kbd><kbd>→</kbd></div>
    </footer>

    <dialog class="index-dialog" id="slide-index" aria-labelledby="index-title">
      <div class="index-header">
        <div>
          <p class="eyebrow">PRESENTACIÓN FINAL · UNSAM</p>
          <h1 id="index-title">Índice</h1>
        </div>
        <button class="icon-button close-index" id="close-index" type="button" aria-label="Cerrar índice" title="Cerrar (Esc)">
          <svg viewBox="0 0 24 24" aria-hidden="true"><path d="m6 6 12 12M18 6 6 18"/></svg>
        </button>
      </div>
      <nav class="slide-grid" id="slide-grid" aria-label="Diapositivas"></nav>
    </dialog>

    <p class="sr-only" id="status-message" role="status" aria-live="polite"></p>
  </body>
</html>
